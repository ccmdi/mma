name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx eslint src/
        working-directory: app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: app

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri.conf.json bundles procedures/*.js as resources; the build script fails when none exist.
      - run: npm ci && npm run build:procedures
        working-directory: app
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo clippy -- -D clippy::correctness
        working-directory: app/src-tauri

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri.conf.json bundles procedures/*.js as resources; the build script fails when none exist.
      - run: npm ci && npm run build:procedures
        working-directory: app
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx vitest run
        working-directory: app
      - run: npm run test:procedures
        working-directory: app

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run gen:image-dims
        working-directory: app
      - name: Fail if image dimensions are stale (run npm run gen:image-dims)
        run: git diff --exit-code -- app/src/components/manual/manual-img-dims.gen.ts

  legacy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The check reads mma.d.ts out of the support floor's release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The API surface is read off mma.d.ts, so a stale one would check nothing.
      - run: npm run gen:plugin-types
        working-directory: app
      - name: Fail if the plugin SDK types are stale (run npm run gen:plugin-types)
        run: git diff --exit-code -- plugins/types/mma.d.ts plugins/types/google-maps.d.ts
      - name: Fail if a stable plugin-visible API was removed without a legacy shim
        run: node plugins/check-legacy.mjs
