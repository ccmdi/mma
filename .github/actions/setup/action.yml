name: Setup
description: Node with the app's dependencies, and optionally the Rust toolchain with Tauri's system libraries.

inputs:
  rust:
    description: Install the Rust toolchain, its build cache and Tauri's system libraries.
    default: 'false'
  plugins:
    description: Install plugin dependencies before running Node gates.
    default: 'false'
  rust-targets:
    description: Extra Rust compilation targets, comma-separated.
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: app/package-lock.json
    - if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        targets: ${{ inputs.rust-targets }}
    - if: inputs.rust == 'true'
      uses: swatinem/rust-cache@v2
      with:
        workspaces: |
          app/src-tauri -> target
          app/src-tauri/crates/geocode -> target
          app/src-tauri/crates/tz -> target
    - shell: bash
      working-directory: app
      run: npm ci

    - if: inputs.plugins == 'true'
      shell: bash
      run: node plugins/build-all.mjs --install
